<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KARYAM - Projects</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="./assets/css/main.css">
</head>

<body>

  <!-- Include Sidebar -->
  <div id="sidebarContainer"></div>

  <!-- Main Content -->
  <div style="margin-left: var(--sidebar-width); padding-top: var(--header-height);">

    <!-- Include Header -->
    <div id="headerContainer"></div>

    <!-- Projects Content -->
    <main style="padding: 32px;">

      <!-- Page Header -->
      <div
        style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 32px; flex-wrap: wrap; gap: 16px;">
        <div>
          <h1 style="font-size: 2rem; font-weight: 800; margin-bottom: 8px;">Projects</h1>
          <p style="color: var(--gray-600); font-size: 14px;">Manage all construction projects</p>
        </div>
        <button id="createProjectBtn" class="btn btn-primary" style="display: none;">
          <span style="font-size: 20px;">+</span>
          <span>New Project</span>
        </button>
      </div>

      <!-- Filters & Search -->
      <div class="card" style="margin-bottom: 24px;">
        <div style="display: grid; grid-template-columns: 1fr auto auto; gap: 16px; align-items: end;">

          <!-- Search -->
          <div class="form-group" style="margin: 0;">
            <label class="form-label">Search Projects</label>
            <input type="text" id="searchInput" class="form-input"
              placeholder="Search by name, location, or manager...">
          </div>

          <!-- Status Filter -->
          <div class="form-group" style="margin: 0; min-width: 180px;">
            <label class="form-label">Status</label>
            <select id="statusFilter" class="form-select">
              <option value="">All Status</option>
              <option value="ACTIVE">Active</option>
              <option value="COMPLETED">Completed</option>
              <option value="PENDING">Pending</option>
              <option value="ON_HOLD">On Hold</option>
            </select>
          </div>

          <!-- Clear Filters -->
          <button id="clearFiltersBtn" class="btn btn-outline">
            <span>Clear</span>
          </button>

        </div>
      </div>

      <!-- Projects Table -->
      <div class="card">
        <div id="loadingState" style="text-align: center; padding: 60px;">
          <div class="loader loader-lg" style="margin: 0 auto 16px;"></div>
          <p style="color: var(--gray-600);">Loading projects...</p>
        </div>

        <div id="tableContainer" style="display: none;">
          <div class="table-container">
            <table class="table">
              <thead>
                <tr>
                  <th>Project ID</th>
                  <th>Project Name</th>
                  <th>Location</th>
                  <th>Budget</th>
                  <th>Manager</th>
                  <th>Status</th>
                  <th>Start Date</th>
                  <th style="text-align: center;">Actions</th>
                </tr>
              </thead>
              <tbody id="projectsTableBody">
                <!-- Rows will be populated here -->
              </tbody>
            </table>
          </div>

          <!-- Pagination -->
          <div id="paginationContainer" class="pagination" style="display: none;">
            <!-- Pagination will be populated here -->
          </div>
        </div>

        <!-- Empty State -->
        <div id="emptyState" style="display: none;" class="empty-state">
          <div class="empty-state-icon">📦</div>
          <div class="empty-state-text">No projects found</div>
          <button id="createFirstProjectBtn" class="btn btn-primary" style="margin-top: 16px; display: none;">
            <span>Create Your First Project</span>
          </button>
        </div>
      </div>

    </main>
  </div>

  <!-- Include Modal -->
  <div id="modalContainer"></div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/stompjs/lib/stomp.min.js"></script>
  <script src="./js/api-utils.js"></script>
  <script src="./js/auth.js"></script>
  <script src="./js/role-permission.js"></script>
  <script src="./js/common.js"></script>
  <script src="./js/modal.js"></script>

  <script>
    let currentPage = 0; // Backend pagination starts from 0
    let totalPages = 0;
    const itemsPerPage = 10;
    let currentProjects = [];

    // Current filter state
    let currentFilters = {
      search: '',
      status: ''
    };

    // Load components
    async function loadComponents() {
      const sidebarRes = await fetch('./components/sidebar.html');
      document.getElementById('sidebarContainer').innerHTML = await sidebarRes.text();

      const headerRes = await fetch('./components/header.html');
      document.getElementById('headerContainer').innerHTML = await headerRes.text();

      const modalRes = await fetch('./components/modal.html');
      document.getElementById('modalContainer').innerHTML = await modalRes.text();

      initSidebar();
      initHeader();

      setPageTitle('Projects', 'Manage all construction projects');
      updateUserInfo();
    }

    // Initialize page
    async function initProjectsPage() {
      if (!initializePage('projects')) return;

      await loadComponents();

      // Show/hide create button based on permission
      const canCreateProject = canCreate('projects');
      document.getElementById('createProjectBtn').style.display = canCreateProject ? 'flex' : 'none';
      document.getElementById('createFirstProjectBtn').style.display = canCreateProject ? 'inline-flex' : 'none';

      // Setup event listeners
      setupEventListeners();

      // Load projects
      await loadProjects();
    }

    // Setup event listeners
    function setupEventListeners() {
      // Create project button
      document.getElementById('createProjectBtn')?.addEventListener('click', openProjectForm);
      document.getElementById('createFirstProjectBtn')?.addEventListener('click', openProjectForm);

      // Search with debounce
      const searchInput = document.getElementById('searchInput');
      searchInput.addEventListener('input', debounce(() => {
        applyFilters();
      }, 300));

      // Status filter
      document.getElementById('statusFilter').addEventListener('change', applyFilters);

      // Clear filters
      document.getElementById('clearFiltersBtn').addEventListener('click', clearFilters);
    }

    // Load projects from API with pagination and filters
    async function loadProjects(page = 0) {
      try {
        showLoader();

        // Build query parameters
        const params = new URLSearchParams({
          page: page,
          size: itemsPerPage,
          sort: 'createdAt,desc'
        });

        // Add optional filter parameters only if they have values
        if (currentFilters.search && currentFilters.search.trim() !== '') {
          params.append('search', currentFilters.search.trim());
        }

        if (currentFilters.status && currentFilters.status !== '') {
          params.append('status', currentFilters.status);
        }

        // Make API call with parameters
        const data = await apiGet(`/projects?${params.toString()}`);

        // Handle Spring Boot Page response format
        currentProjects = data.content.projects || [];
        currentPage = data.content.number || 0;
        totalPages = data.content.totalPages || 0;

        hideLoader();
        renderProjects();
      } catch (error) {
        hideLoader();
        handleApiError(error);
        showEmptyState();
      }
    }

    // Apply filters - reload data from backend
    function applyFilters() {
      // Update current filter state
      currentFilters.search = document.getElementById('searchInput').value;
      currentFilters.status = document.getElementById('statusFilter').value;

      // Reset to first page and reload
      loadProjects(0);
    }

    // Clear all filters
    function clearFilters() {
      // Clear filter inputs
      document.getElementById('searchInput').value = '';
      document.getElementById('statusFilter').value = '';

      // Reset filter state
      currentFilters = {
        search: '',
        status: ''
      };

      // Reload projects from first page
      loadProjects(0);
    }

    // Render projects table
    function renderProjects() {
      const loadingState = document.getElementById('loadingState');
      const tableContainer = document.getElementById('tableContainer');
      const emptyState = document.getElementById('emptyState');

      loadingState.style.display = 'none';

      if (currentProjects.length === 0) {
        tableContainer.style.display = 'none';
        emptyState.style.display = 'block';
        return;
      }

      emptyState.style.display = 'none';
      tableContainer.style.display = 'block';

      // Render table rows
      const tbody = document.getElementById('projectsTableBody');
      tbody.innerHTML = currentProjects.map(project => `
        <tr>
          <td style="font-family: var(--font-display); font-weight: 600; color: var(--primary);">
            ${project.projectId || '-'}
          </td>
          <td>
            <div style="font-weight: 600; margin-bottom: 2px;">${escapeHtml(project.name)}</div>
            <div style="font-size: 12px; color: var(--gray-500);">${truncate(project.description || '', 40)}</div>
          </td>
          <td>
            <span style="font-size: 14px;">📍</span> ${escapeHtml(project.location || '-')}
          </td>
          <td style="font-weight: 700; color: var(--gray-900);">
            ${formatCurrency(project.budget)}
          </td>
          <td>${escapeHtml(project.manager || '-')}</td>
          <td>${getStatusBadge(project.status)}</td>
          <td style="font-size: 13px; color: var(--gray-600);">
            ${formatDate(project.startDate)}
          </td>
          <td>
            <div style="display: flex; gap: 8px; justify-content: center;">
              <button onclick="viewProject('${project.id || project.projectId}')" class="btn btn-sm btn-outline" title="View Details">
                👁️
              </button>
              ${canEdit('projects') ? `
                <button onclick="editProject('${project.id || project.projectId}')" class="btn btn-sm btn-outline" title="Edit">
                  ✏️
                </button>
              ` : ''}
              ${canDelete('projects') ? `
                <button onclick="deleteProject('${project.id || project.projectId}', '${escapeHtml(project.name)}')" class="btn btn-sm btn-danger" title="Delete">
                  🗑️
                </button>
              ` : ''}
            </div>
          </td>
        </tr>
      `).join('');

      // Render pagination
      renderPagination();
    }

    // Render pagination
    function renderPagination() {
      const container = document.getElementById('paginationContainer');

      if (totalPages <= 1) {
        container.style.display = 'none';
        return;
      }

      container.style.display = 'flex';

      let html = '';

      // Previous button
      html += `
        <button class="pagination-btn" ${currentPage === 0 ? 'disabled' : ''} onclick="changePage(${currentPage - 1})">
          ← Previous
        </button>
      `;

      // Page numbers (convert 0-based to 1-based for display)
      for (let i = 0; i < totalPages; i++) {
        if (i === 0 || i === totalPages - 1 || (i >= currentPage - 1 && i <= currentPage + 1)) {
          html += `
            <button class="pagination-btn ${i === currentPage ? 'active' : ''}" onclick="changePage(${i})">
              ${i + 1}
            </button>
          `;
        } else if (i === currentPage - 2 || i === currentPage + 2) {
          html += '<span style="padding: 8px;">...</span>';
        }
      }

      // Next button
      html += `
        <button class="pagination-btn" ${currentPage === totalPages - 1 ? 'disabled' : ''} onclick="changePage(${currentPage + 1})">
          Next →
        </button>
      `;

      container.innerHTML = html;
    }

    // Change page
    function changePage(page) {
      if (page < 0 || page >= totalPages) return;
      loadProjects(page);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Open project form
    function openProjectForm() {
      window.location.href = 'project-form.html';
    }

    // View project details
    async function viewProject(projectId) {
      try {
        showLoader();
        let data = await apiGet(`/projects/${projectId}`);
        const project = data.content;
        hideLoader();

        showDetailsModal('Project Details', {
          'Project ID': project.projectId,
          'Project Name': project.name,
          'Location': project.location || '-',
          'Budget': formatCurrency(project.budget),
          'Manager': project.manager || '-',
          'Status': project.status,
          'Start Date': formatDate(project.startDate),
          'End Date': formatDate(project.endDate),
          'Description': project.description || '-'
        });
      } catch (error) {
        hideLoader();
        handleApiError(error);
      }
    }

    // Edit project
    function editProject(projectId) {
      window.location.href = `project-form.html?id=${projectId}`;
    }

    // Delete project
    async function deleteProject(projectId, projectName) {
      const confirmed = await confirmDialog(
        `Are you sure you want to delete project "${projectName}"? This action cannot be undone.`
      );

      if (!confirmed) return;

      try {
        showLoader();
        await apiDelete(`/projects/${projectId}`);
        hideLoader();

        showToast('Project deleted successfully', 'success');

        // Reload current page, or go to first page if current page becomes empty
        if (currentProjects.length === 1 && currentPage > 0) {
          loadProjects(currentPage - 1);
        } else {
          loadProjects(currentPage);
        }
      } catch (error) {
        hideLoader();
        handleApiError(error);
      }
    }

    // Show empty state
    function showEmptyState() {
      document.getElementById('loadingState').style.display = 'none';
      document.getElementById('tableContainer').style.display = 'none';
      document.getElementById('emptyState').style.display = 'block';
    }

    // Initialize on page load
    document.addEventListener('DOMContentLoaded', initProjectsPage);
  </script>

</body>

</html>
