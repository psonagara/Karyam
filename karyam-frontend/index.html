<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KARYAM - Construction ERP</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body style="background: linear-gradient(135deg, #2C3E50 0%, #34495E 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center;">
  
  <div style="text-align: center;">
    <!-- Logo -->
    <div style="margin-bottom: 32px; animation: fadeIn 0.6s ease;">
      <div style="width: 120px; height: 120px; margin: 0 auto 24px; background: var(--primary); border-radius: 24px; display: flex; align-items: center; justify-content: center; font-size: 72px; box-shadow: var(--shadow-xl);">
        🏗️
      </div>
      <h1 style="color: white; font-size: 4rem; font-weight: 800; letter-spacing: -2px; margin-bottom: 8px;">KARYAM</h1>
      <p style="color: rgba(255, 255, 255, 0.8); font-size: 1.25rem; font-weight: 500;">Construction Operations Platform</p>
    </div>
    
    <!-- Loading Indicator -->
    <div class="loader loader-lg" style="margin: 32px auto;"></div>
    <p style="color: rgba(255, 255, 255, 0.7); font-size: 14px; margin-top: 16px;">Loading application...</p>
  </div>

  <!-- Scripts -->
  <script src="js/api-utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/role-permission.js"></script>
  
  <script>
    // Redirect logic
    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        if (isAuthenticated()) {
          window.location.href = 'dashboard.html';
        } else {
          window.location.href = 'login.html';
        }
      }, 800);
    });
  </script>
  
  <style>
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
  
</body>
</html>
