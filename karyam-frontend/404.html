<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | KARYAM</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="./assets/css/main.css">
</head>
<body style="background: linear-gradient(135deg, #2C3E50 0%, #34495E 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center;">
  
  <div class="container" style="max-width: 700px; text-align: center;">
    <div class="card" style="padding: 60px 40px;">
      
      <!-- 404 Animation -->
      <div style="margin-bottom: 32px;">
        <div style="font-size: 120px; font-weight: 900; color: var(--primary); line-height: 1; font-family: var(--font-display); animation: bounce 2s ease-in-out infinite;">
          404
        </div>
      </div>
      
      <!-- Error Message -->
      <h1 style="font-size: 2.5rem; font-weight: 800; color: var(--gray-900); margin-bottom: 16px;">
        Page Not Found
      </h1>
      
      <p style="font-size: 1.125rem; color: var(--gray-600); margin-bottom: 32px; line-height: 1.6;">
        Oops! The page you're looking for doesn't exist. <br>
        It might have been moved or deleted.
      </p>
      
      <!-- Search Box -->
      <div style="max-width: 400px; margin: 0 auto 32px;">
        <div style="position: relative;">
          <input 
            type="text" 
            id="searchBox" 
            class="form-input" 
            placeholder="Search for a page..." 
            style="padding-left: 40px;"
          >
          <span style="position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-size: 18px;">
            🔍
          </span>
        </div>
      </div>
      
      <!-- Quick Links -->
      <div style="background: var(--gray-100); border-radius: var(--radius-lg); padding: 24px; margin-bottom: 32px;">
        <h3 style="font-weight: 700; margin-bottom: 16px; color: var(--gray-800);">Quick Links</h3>
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px;">
          <a href="dashboard.html" class="quick-link">
            <span style="font-size: 24px;">📊</span>
            <span>Dashboard</span>
          </a>
          <a href="projects.html" class="quick-link">
            <span style="font-size: 24px;">🏗️</span>
            <span>Projects</span>
          </a>
          <a href="labor-list.html" class="quick-link">
            <span style="font-size: 24px;">👷</span>
            <span>Labor</span>
          </a>
          <a href="expenses.html" class="quick-link">
            <span style="font-size: 24px;">💰</span>
            <span>Expenses</span>
          </a>
        </div>
      </div>
      
      <!-- Action Buttons -->
      <div style="display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;">
        <a href="dashboard.html" class="btn btn-primary btn-lg">
          <span style="font-size: 18px;">🏠</span>
          <span>Go to Dashboard</span>
        </a>
        <button onclick="window.history.back()" class="btn btn-outline btn-lg">
          <span style="font-size: 18px;">←</span>
          <span>Go Back</span>
        </button>
      </div>
      
      <!-- Help Text -->
      <div style="margin-top: 32px; padding-top: 32px; border-top: 1px solid var(--gray-200);">
        <p style="font-size: 14px; color: var(--gray-600);">
          <strong>Still need help?</strong> Contact support at 
          <a href="mailto:support@karyam.com" style="color: var(--primary); font-weight: 600;">support@karyam.com</a>
        </p>
      </div>
      
    </div>
    
    <!-- Footer -->
    <p style="text-align: center; margin-top: 24px; color: rgba(255, 255, 255, 0.7); font-size: 14px;">
      © 2024 KARYAM Construction ERP. All rights reserved.
    </p>
  </div>

  <style>
    @keyframes bounce {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-10px);
      }
    }
    
    .quick-link {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 16px;
      background: white;
      border-radius: var(--radius);
      text-decoration: none;
      color: var(--gray-700);
      transition: var(--transition);
      border: 2px solid transparent;
    }
    
    .quick-link:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-md);
      border-color: var(--primary);
      color: var(--primary);
    }
    
    .quick-link span:last-child {
      font-weight: 600;
      font-family: var(--font-display);
      font-size: 14px;
    }
  </style>
  
  <script>
    // Simple search functionality
    document.getElementById('searchBox').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        const query = e.target.value.toLowerCase();
        
        // Simple page mapping
        const pages = {
          'dashboard': 'dashboard.html',
          'home': 'dashboard.html',
          'project': 'projects.html',
          'projects': 'projects.html',
          'labor': 'labor-list.html',
          'worker': 'labor-list.html',
          'attendance': 'attendance.html',
          'vendor': 'vendors.html',
          'expense': 'expenses.html',
          'approval': 'approvals.html',
          'payroll': 'payroll.html',
          'report': 'reports.html',
          'audit': 'audit-logs.html',
          'log': 'audit-logs.html'
        };
        
        for (const [key, url] of Object.entries(pages)) {
          if (query.includes(key)) {
            window.location.href = url;
            return;
          }
        }
        
        alert('No matching page found. Try: dashboard, projects, labor, expenses, etc.');
      }
    });
  </script>
  
</body>
</html>
