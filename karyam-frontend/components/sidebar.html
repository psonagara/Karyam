<style>
  .nav-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
    margin-bottom: 4px;
    border-radius: var(--radius);

    text-decoration: none;
    font-weight: 500;
    font-family: var(--font-display);
    transition: var(--transition);
    font-size: 14px;
    cursor: pointer;
  }

  .nav-item:hover {
    background: rgba(255, 255, 255, 0.1);
    color: white;
    transform: translateX(4px);
  }

  .nav-item.active {
    background: var(--primary);
    color: white;
  }

  .nav-icon {
    font-size: 20px;
    width: 24px;
    text-align: center;
  }

  @media (max-width: 768px) {
    #sidebar {
      transform: translateX(-100%);

    #sidebar.mobile-open {
      transform: translateX(0);
