<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Access Denied - KARYAM</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="./assets/css/main.css">
</head>
<body style="background: linear-gradient(135deg, #2C3E50 0%, #34495E 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center;">
  
  <div class="container" style="max-width: 600px; text-align: center;">
    <div class="card" style="padding: 60px 40px;">
      
      <!-- Error Icon -->
      <div style="margin-bottom: 32px;">
        <div style="width: 120px; height: 120px; margin: 0 auto; background: var(--danger-light); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 64px; animation: pulse 2s ease-in-out infinite;">
          🚫
        </div>
      </div>
      
      <!-- Error Message -->
      <h1 style="font-size: 3rem; font-weight: 800; color: var(--gray-900); margin-bottom: 16px;">
        Access Denied
      </h1>
      
      <p style="font-size: 1.125rem; color: var(--gray-600); margin-bottom: 32px; line-height: 1.6;">
        You do not have permission to access this page. <br>
        Please contact your administrator if you believe this is an error.
      </p>
      
      <!-- User Info -->
      <div id="userInfoCard" style="background: var(--gray-100); border-radius: var(--radius-lg); padding: 20px; margin-bottom: 32px; text-align: left;">
        <div style="display: grid; grid-template-columns: 120px 1fr; gap: 12px; align-items: center;">
          <div style="color: var(--gray-600); font-weight: 600; font-size: 13px;">Logged in as:</div>
          <div id="userName" style="font-weight: 700; color: var(--gray-900);">-</div>
          
          <div style="color: var(--gray-600); font-weight: 600; font-size: 13px;">Role:</div>
          <div>
            <span id="userRole" class="badge badge-info">-</span>
          </div>
        </div>
      </div>
      
      <!-- Action Buttons -->
      <div style="display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;">
        <a href="dashboard.html" class="btn btn-primary btn-lg">
          <span style="font-size: 18px;">🏠</span>
          Go to Dashboard
        </a>
        <button onclick="handleLogout()" class="btn btn-outline btn-lg">
          <span style="font-size: 18px;">🚪</span>
          Logout
        </button>
      </div>
      
      <!-- Help Text -->
      <div style="margin-top: 32px; padding-top: 32px; border-top: 1px solid var(--gray-200);">
        <p style="font-size: 14px; color: var(--gray-600);">
          <strong>Need help?</strong> Contact your system administrator at 
          <a href="mailto:admin@karyam.com" style="color: var(--primary); font-weight: 600;">admin@karyam.com</a>
        </p>
      </div>
      
    </div>
  </div>

  <!-- Scripts -->
  <script src="./js/api-utils.js"></script>
  <script src="./js/auth.js"></script>
  <script src="./js/role-permission.js"></script>
  <script src="./js/common.js"></script>
  
  <script>
    // Update user info
    function updatePageInfo() {
      const user = getCurrentUser();
      if (user) {
        document.getElementById('userName').textContent = user.name;
        const roleElement = document.getElementById('userRole');
        roleElement.textContent = getRoleDisplayName(user.role);
        roleElement.className = `badge ${getRoleBadgeClass(user.role)}`;
      } else {
        // Not logged in, redirect to login
        window.location.href = 'login.html';
      }
    }
    
    // Handle logout
    function handleLogout() {
      if (confirm('Are you sure you want to logout?')) {
        logout();
      }
    }
    
    // Pulse animation
    const style = document.createElement('style');
    style.textContent = `
      @keyframes pulse {
        0%, 100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.05);
        }
      }
    `;
    document.head.appendChild(style);
    
    // Initialize on page load
    document.addEventListener('DOMContentLoaded', updatePageInfo);
  </script>
  
</body>
</html>
